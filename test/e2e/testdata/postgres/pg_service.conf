# Example service file for trying out `conm postgres import`:
#
#   conm postgres import --path test/e2e/testdata/postgres/pg_service.conf --show
#
# The first two services match the containers in docker-compose.yml.

# Password in the service itself: it goes to the keyring on import.
[local]
host=localhost
port=5432
user=postgres
password=pg-s3cret
dbname=postgres

# No password here: it is looked up in ~/.pgpass (or $PGPASSFILE), if a row matches.
[local-noauth]
host=localhost
port=5433
user=postgres
dbname=postgres
sslmode=disable

# A schema and a parameter conm has no field for: imported, connect_timeout is ignored.
[reports]
host=reports.internal
user=analyst
dbname=warehouse
options=-c search_path=reports
connect_timeout=5

# Same target as [local]: reported as already there once [local] is imported.
[local-copy]
host=localhost
port=5432
user=postgres
dbname=postgres

# No user and no database: cannot be imported as it is, -i opens it in the form.
[incomplete]
host=staging.internal

# Needs a certificate file: cannot be imported, only the TLS mode is supported yet.
[cloud]
host=db.example.com
user=app
dbname=app
sslmode=verify-full
sslrootcert=/etc/ssl/certs/ca.pem
